services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      retries: 10
      start_period: 20s

  api:
    build: ./backend/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DbConnectionString: Server=db;Database=smartdb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  dbdata:
