services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - dbdata:/var/opt/mssql
    restart: unless-stopped

  api:
    build: ./backend/backend
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DbConnectionString: "Server=db;Database=SmartMealDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${Jwt__Key}"
      Jwt__Issuer: "${Jwt__Issuer}"
      Jwt__Audience: "${Jwt__Audience}"
      Jwt__ExpiryMinutes: "${Jwt__ExpiryMinutes}"
      CijeneApi__BaseUrl: "${CijeneApi__BaseUrl}"
      CijeneApi__ApiKey: "${CijeneApi__ApiKey}"
      CijeneApi__Chains: "${CijeneApi__Chains}"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  dbdata:
